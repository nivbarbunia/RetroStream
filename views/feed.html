<!DOCTYPE html>
<html dir ="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רטרו-פורום</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/feed.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <h1>רטרו פורום</h1>
    <form id="post-form" class="d-flex flex-column gap-3 mx-auto mb-5" style="max-width: 500px;">
        <h2>צור פוסט</h2>
        <div class="d-flex gap-2">
            <input type="text" id="title" class="w-50" placeholder="כותרת" required>
            <input type="text" id="author" class="w-50" placeholder="שם כותב" required>
        </div>
        <textarea id="content" placeholder="תוכן" required></textarea>
        <button type="submit">פרסם</button>
    </form>

    <div id="posts-container"></div>
   
    <div class="modal fade" id="deleteModal" tabindex="-1">  <!-- CONFIRM DELETE--> 
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">מחיקת פוסט</h5>
                </div>
                <div class="modal-body">האם אתה בטוח שברצונך למחוק את הפוסט?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ביטול</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">מחק</button>
                </div>
            </div>
        </div>
    </div>
    

    <script src="/js/feed.js"></script>
</body>
</html>
