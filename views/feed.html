<!DOCTYPE html>
<html dir ="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רטרו-פורום</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/feed.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<body>
    <h1>רטרו פורום</h1>
    <form id="post-form" class="d-flex flex-column gap-3 mx-auto mb-5" style="max-width: 500px;">
        <h2>צור פוסט</h2>
        <div class="d-flex gap-2">
            <input type="text" id="title" class="w-50" placeholder="כותרת" required>
            <input type="text" id="author" class="w-50" placeholder="שם כותב" required>
        </div>
        <textarea id="content" placeholder="תוכן" required></textarea>
        <button type="submit">פרסם</button>
    </form>

    <div id="posts-container"></div>

    <script src="/js/feed.js"></script>
</body>
</html>
