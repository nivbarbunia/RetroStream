<!doctype html>
<html dir="auto" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - שירות הסטרימינג של הנוסטלגיה הישראלית</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" /> <!--site's favicon-->
    <link rel="stylesheet" href="LoginStyle.css"> <!--reference to a style code block -->
   
  </head>
  
  
  <body>
    <div class="wrapper">
      <h1 id="headline">התחברות לרטרו סטרים</h1>
      <form id="myform">
        <input type="email" id="email" placeholder="אי-מייל" required /> <br />
        <input type="password" id="password" placeholder="סיסמא" required />
        <br />
        <label><input id="checkbox" type="checkbox" /> תזכור אותי</label>
        <a id="forgot" class="formlink" href="#">שכחת סיסמא?</a> <br />
        <button id="submit" type="submit">התחברות</button>
      
      </form>
      <p id="message"></p>
     <p>אין לך חשבון? <a id= "signup" class="formlink" href="#">הירשם עכשיו</a></p>
    </div>
    <script src="Login.js"></script>
  </body>
</html>
