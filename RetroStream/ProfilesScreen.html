<!doctype html>
<html dir="auto" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - שירות הסטרימינג של הנוסטלגיה הישראלית</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <!--site's favicon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ProfilesStyle.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  </head>

  <body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    
    <h1 id="headline">בחר פרופיל</h1>
    <br />
    
    <div class="profiles d-flex gap-5 flex-wrap justify-content-center">
      
      <div class="profile">
        <img src="Assets/chief.png" alt="user1" />
        <div class="name-section">
          <span class="name"> ניב </span>
          <button class="edit-btn" ><i class="fa-regular fa-pen-to-square"></i></button>
          <input type="text" value="ניב" class="name-input" />
        </div>
      </div>

      <div class="profile">
       <img src="Assets/Roni.png" alt="user2" />
        <div class="name-section">
          <span class="name"> אוראל </span>
          <button class="edit-btn" ><i class="fa-regular fa-pen-to-square"></i></button>
          <input type="text" value="אוראל" class="name-input" />
        </div>
      </div>

      <div class="profile">
        <img src="Assets/fadida.png" alt="user3" />
        <div class="name-section">
          <span class="name">ג'סי</span>
          <button class="edit-btn" ><i class="fa-regular fa-pen-to-square"></i></button>
          <input type="text" value="ג'סי" class="name-input" />
        </div>

      </div>

      <div class="add">
        <div class="plus">+</div>
        <div class="add-user">
          <span class="name">הוסף משתמש</span>
        </div>
      </div>
    </div>
    <script src="ProfilesScreen.js"></script>
  </body>
</html>
