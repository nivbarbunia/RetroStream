<!doctype html>
<html dir="auto" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - הרשמה</title>
    <link rel="icon" href="Assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="wrapper">
      <h1 id="headline">הרשמה לרטרו סטרים</h1>
      <form id="myform" novalidate>
        <input type="text" id="name" placeholder="שם" required /> <br />
        <input type="email" id="email" placeholder="אי-מייל" required /> <br />
        <input type="password" id="password" placeholder="סיסמא" required />
        <br />
        <p id="message"></p>
        <button id="submit" type="submit">הרשמה</button>
      </form>
      <p>כבר יש לך חשבון? <a id="login-link" class="formlink" href="/">התחבר עכשיו</a></p>
    </div>
    <script src="/js/register.js"></script>
  </body>
</html>
