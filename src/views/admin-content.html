<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - ניהול תכנים</title>
    <link rel="icon" href="/Assets/favicon.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/admin-shared.css">
    <link rel="stylesheet" href="/css/admin-content.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  </head>

  <body class="p-4">
    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="headline" class="m-0">ניהול תכנים</h1>
      <nav class="d-flex gap-3 align-items-center">
        <a href="/admin" class="admin-link">חזרה למרכז בקרה</a>
        <button id="logoutBtn" class="btn-logout">התנתק<i id="logoutIcon" class="fa-solid fa-right-from-bracket me-2"></i></button>
      </nav>
    </header>

    
    <!-- SEARCH -->
    <div class="search-row d-flex flex-column gap-2 mb-3">
      <!--1ST ROW-->
      <div class="d-flex align-items-center gap-3 w-100">
        <label for="searchMode" class="searchModeLabel">חפש לפי:</label>
        <select id="searchMode" class="searchSelect">
          <option value="title">כותרת</option>
          <option value="genre">ז'אנר</option>
          <option value="origin">מקור</option>
          <option value="franchise">פרנצ'ייז</option>
          <option value="description">תיאור</option>
          <option value="year">שנה</option>
          <option value="ratingMin">דירוג מינימלי</option>
          <option value="ratingMax">דירוג מקסימלי</option>
          <option value="maxLength">אורך מקסימלי (דק')</option>
          <option value="q">חיפוש חופשי</option>
        </select>
        <button id="resetBtn" class="searchRowBtn hidden d-flex align-items-center align-self-stretch gap-2">אפס חיפוש<i class="fa-solid fa-filter-circle-xmark"></i></button>
      </div>

      <!--2ND ROW-->
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <input type="text" id="searchInput" class="searchInput" placeholder="חפש לפי כותרת..." autocomplete="off" />
        <button id="submitBtn" class="searchRowBtn d-flex align-items-center gap-2">חפש<i class="fa-solid fa-magnifying-glass"></i></button>
        <div class="type-radio-group">
          <label class="type-radio"><input type="radio" name="typeFilter" value="" checked />הכל</label>
          <label class="type-radio"><input type="radio" name="typeFilter" value="סדרה" />סדרה</label>
          <label class="type-radio"><input type="radio" name="typeFilter" value="סרט" />סרט</label>
        </div>
        <p id="message" class="message mb-0 me-3"></p>
        <button id="addBtn" class="searchRowBtn d-flex align-items-center gap-2">הוסף תוכן<i class="fa-solid fa-plus"></i></button>
      </div>

      <!--3RD ROW: ACTIVE FILTER CHIPS-->
      <div id="activeFilters" class="d-flex flex-wrap gap-2"></div>
    </div>

    <!-- TABLE -->
    <div class="wrapper">
      <table class="users-table">
        <thead>
          <tr>
            <th>תמונה</th>
            <th class="sortable" data-sort="title">כותרת <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="year">שנה <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="type">סוג <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="genre">ז'אנר <span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="rating">דירוג <span class="sort-arrow"></span></th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="contentBody"></tbody>
      </table>
    </div>
    </div>

    <!-- CREATE / EDIT MODAL (Bootstrap) -->
    <div class="modal fade" id="contentModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content edit-modal">
          <div class="modal-header d-flex justify-content-between">
            <h2 id="modalTitle" class="modal-title fs-4">הוספת תוכן</h2>
            <button type="button" class="btn-close btn-close-white m-0" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <span class="d-flex justify-content-center text-center">
              <div class="d-flex flex-column w-50">
                <label for="formTitle">כותרת</label>
                <input type="text" id="formTitle" />
              </div>
            </span>

            <span class="d-flex gap-4">
              <div class="d-flex flex-column w-25" id="episodeLengthWrap">
                <label for="formEpisodeLength">אורך פרק (דק')</label>
                <input type="number" id="formEpisodeLength" />
              </div>
              <div class="d-flex flex-column w-25" id="durationWrap">
                <label for="formDuration">משך (דק')</label>
                <input type="number" id="formDuration" />
              </div>
              <div class="d-flex flex-column w-25">
                <label for="formRating">דירוג (0-10)</label>
                <input type="number" id="formRating" min="0" max="10" step="0.1" />
              </div>
              <div class="d-flex flex-column w-25">
                <label for="formType">סוג</label>
                <select id="formType">
                  <option value="סדרה">סדרה</option>
                  <option value="סרט">סרט</option>
                </select>
              </div>
              <div class="d-flex flex-column w-25">
                <label for="formYear">שנה</label>
                <input type="number" id="formYear" />
              </div>
            </span>

            <span class="d-flex gap-4">
              <div class="d-flex flex-column flex-fill">
                <label for="formGenre">ז'אנרים [ , ]</label>
                <input type="text" id="formGenre" placeholder="פעולה, קומדיה" />
              </div>
              <div class="d-flex flex-column flex-fill">
                <label for="formOrigin">מקור [ , ]</label>
                <input type="text" id="formOrigin" placeholder="" />
              </div>
              <div class="d-flex flex-column flex-fill">
                <label for="formFranchise">פרנצ'ייז [ , ]</label>
                <input type="text" id="formFranchise" placeholder="מותג, יוצר, שחקן" />
              </div>
            </span>

            <span class="d-flex gap-4">
              <div class="d-flex flex-column w-50">
                <label for="formImage">קישור תמונה</label>
                <input type="text" id="formImage" />
              </div>
              <div class="d-flex flex-column w-50">
                <label for="formVideoUrl">קישור וידאו</label>
                <input type="text" id="formVideoUrl" />
              </div>
            </span>

            <span class="d-flex gap-4">
              <div class="d-flex flex-column w-50">
                <label for="formFilmingLocation">מיקום צילומים (כתובת)</label>
                <input type="text" id="formFilmingLocation" placeholder="לדוגמה: תל אביב, ישראל" />
              </div>
            </span>


            <div>
              <label for="formDescription">תיאור</label>
              <textarea id="formDescription" rows="3"></textarea>
            </div>

            <p id="modalMessage" class="m-0"></p>
          </div>
          <div class="modal-footer">
            <button id="saveContent" class="btn-save">שמור</button>
            <button class="btn-cancel" data-bs-dismiss="modal">ביטול</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-content.js"></script>
  </body>
</html>
