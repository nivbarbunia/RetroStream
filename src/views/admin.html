<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - מרכז בקרה</title>
    <link rel="icon" href="Assets/favicon.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  </head>

  <body class="p-4">
    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center mb-5">
      <h1 id="headline" class="m-0">מרכז בקרה</h1>
      <nav class="d-flex gap-3 align-items-center">
        <a href="/account" class="admin-link">נהל חשבון</a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">התנתק<i id="logoutIcon" class="fa-solid fa-right-from-bracket me-2"></i></button>
      </nav>
    </header>

    <!-- DASHBOARD CARDS -->
    <section class="row g-5 justify-content-center mx-auto" style="max-width: 60rem;">
      <div class="col-12 col-sm-6 col-md-6">
        <a href="/admin/users" class="dash-card">
          <i class="fa-solid fa-users"></i>
          <span>ניהול משתמשים</span>
          <span class="dash-details">· הצגה, חיפוש, עריכה ומחיקת משתמשים ·</span>
        </a>
      </div>
      <div class="col-12 col-sm-6 col-md-6">
        <a href="/admin/content" class="dash-card">
          <i class="fa-solid fa-film"></i>
          <span>ניהול תכנים</span>
          <span class="dash-details">· הוספה, עריכה ומחיקת סרטים וסדרות ·</span>
        </a>
      </div>
      <div class="col-12 col-sm-6 col-md-6">
        <a href="/admin/stats" class="dash-card">
          <i class="fa-solid fa-chart-simple"></i>
          <span>צפייה בנתונים</span>
          <span class="dash-details">· גרפים וסטטיסטיקות על התוכן והמשתמשים ·</span>
        </a>
      </div>
      <div class="col-12 col-sm-6 col-md-6">
        <a href="/profiles" class="dash-card">
          <i class="fa-solid fa-eye"></i>
          <span>חווית משתמש</span>
          <span class="dash-details">· כניסה לאתר כמו משתמש רגיל ·</span>
        </a>
      </div>
    </section>

    <script src="/js/admin.js"></script>
  </body>
</html>
