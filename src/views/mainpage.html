<!DOCTYPE html>
<html dir="rtl" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רטרו סטרים - שירות הסטרימינג של הנוסטלגיה הישראלית</title>
    <link rel="icon" href="Assets/favicon.png" type="image/png" /> <!--site's favicon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/mainpage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-xl retro-navbar px-1 py-2">
        <div class="container-fluid">
            <a class="navbar-brand logo" href="#" id="homeLink">רטרו סטרים</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav px-2 mb-2 mb-xl-0 gap-xl-1">
                    <li class="nav-item"><a class="nav-link" href="#" data-category="home">דף הבית</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="series">סדרות</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="movies">סרטים</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="origin">ערוצים</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="nineties">הניינטיז</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="y2000s">2000s</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-category="mylist">הרשימה שלי</a></li>
                </ul>
            </div>

            <div class="navbar-icons d-flex align-items-center gap-2 me">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="חפש תוכן..." />
                        <button id="searchToggle" class="icon-btn">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                    <div class="profile-menu">
                        <span class="dropdown"><img id="profile" src="" alt="current user"><i class="fa-solid fa-caret-down"></i></span>
                        <div id="profileDropdown" class="profile-dropdown hidden">
                            <span class="profile-name-row">
                                <img id="activeProfileImg" class="profile-name-img" alt="">
                                <p id="activeProfileName" class="profile-name m-0"></p>
                            </span>
                            <span class="drop-row"><i class="fa-solid fa-shuffle"></i><a href="/profiles">החלף פרופיל</a></span>
                            <span class="drop-row"><i class="fa-solid fa-user-pen"></i><a href="/account">נהל חשבון</a></span>
                            <span id="logoutBtn" class="drop-row"><i id="logoutIcon" class="fa-solid fa-right-from-bracket"></i><button>התנתק</button></span>
                        </div>
                    </div>
                </div>
        </div>
    </nav>  
    <main class="container-fluid py-4 text-light">
        <span>
        <section id="categoryHeader" class="category-header d-flex justify-content-start mx-5 mt-0 mb-2"></section>
        <section id="noHeroHeader" class="category-header d-flex justify-content-center mx-auto mt-0 mb-0"></section>
        </span>
        <section id="heroSection" class="hero-section mt-0 mb-4"></section>

        <section class="mb-4">
            <div id="feedContainer" class="feed-container">
                <!-- Dynamic content will be inserted here -->
            </div>
        </section>
    </main>

    <!-- CONTENT SCREEN MODAL -->
    <div class="modal fade" id="contentScreenModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg mt-3">
            <div class="modal-content content-modal">
                <button type="button" class="modal-close" data-bs-dismiss="modal">
                <i class="fa-solid fa-xmark"></i>
                </button>

                <div class="content-modal-tabs">
                    <button type="button" class="content-tab-btn active" data-tab="watch">צפה בתוכן</button>
                    <button type="button" class="content-tab-btn" data-tab="reviews">תגובות ודירוגים</button>
                    <button type="button" class="content-tab-btn" data-tab="details">פרטים נוספים</button>
                </div>

                <div class="content-tab active" id="tabWatch">
                    <div class="video-wrap" id="videoWrap">
                        <video id="contentVideo" class="content-video" preload="metadata"></video>
                        <div class="video-unavailable">
                            <i class="fa-solid fa-satellite-dish"></i>
                            <h2> אין וידיאו זמין לתוכן זה</h2>
                            <i class="fa-solid fa-satellite-dish"></i>
                        </div>
                        <div class="video-controls">
                            <button id="videoFullscreenBtn" class="video-ctrl-btn" type="button"><i class="fa-solid fa-expand"></i></button>
                            <span id="videoCurrentTime" class="video-time">0:00</span>
                            <input type="range" id="videoProgress" class="video-progress" value="0" min="0" max="100" step="0.1">
                            <span id="videoDuration" class="video-time">0:00</span>
                            <button id="videoMuteBtn" class="video-ctrl-btn" type="button"><i class="fa-solid fa-volume-high"></i></button>
                            <button id="videoPlayBtn" class="video-ctrl-btn" type="button"><i class="fa-solid fa-play"></i></button>
                        </div>
                    </div>
                    <div class="modal-body content-modal-body">
                        <div class="modal-title-row">
                            <h2 id="modalTitle" class="modal-title"></h2>
                            <button id="likeBtn" class="like-btn">
                            <i class="fa-regular fa-heart"></i>
                            </button>
                        </div>
                        <p id="modalDetails" class="modal-details"></p>
                        <p id="modalDescription" class="modal-description"></p>
                    </div>
                </div>

                <div class="content-tab" id="tabReviews">
                    <div class="content-modal-body">
                        <p class="tab-placeholder">בקרוב: תגובות ודירוגים</p>
                    </div>
                </div>

                <div class="content-tab" id="tabDetails">
                    <div class="content-modal-body details-tab-body">
                        <h3 class="details-subheading">מיקום צילומים</h3>
                        <div id="filmingMap" class="filming-map"></div>
                        <p id="filmingMapEmpty" class="tab-placeholder hidden">אין מידע על מיקום צילומים לתוכן זה</p>

                        <h3 class="details-subheading">קליפ נוסטלגי</h3>
                        <div id="youtubeClipWrap" class="youtube-clip-wrap"></div>
                        <p id="youtubeClipEmpty" class="tab-placeholder hidden">לא נמצא קליפ רלוונטי</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/mainpage.js"></script>
</body>
</html>
