<!doctype html>
<html dir="auto" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - שירות הסטרימינג של הנוסטלגיה הישראלית</title>
    <link rel="icon" href="Assets/favicon.png" type="image/png" />
    <!--site's favicon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/profiles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  </head>

  <body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <h1 id="headline" class="mb-5">בחר פרופיל</h1>
    <!--PROFILES SECTION-->
    <div class="profiles d-flex gap-4 flex-wrap justify-content-center">
      <div class="add">
        <div class="plus">+</div>
        <div class="add-user">
          <span class="name">הוסף פרופיל</span>
        </div>
      </div>
    </div>
    <!--ADD/EDIT PANEL-->
    <div id="profilePanel" class="panel-overlay hidden">
      <div class="panel-box">
        <h2 id="panelTitle"></h2>
        <input type="text" class="w-50" id="newProfileName" placeholder="שם הפרופיל" />
        <p id="panelError" class="panel-error hidden"></p>
        <div class="avatar-grid">
          <img src="Assets/Users/default.png" class="avatar-option" />
          <img src="Assets/Users/chief.png" class="avatar-option" />
          <img src="Assets/Users/Roni.png" class="avatar-option" />
          <img src="Assets/Users/fadida.png" class="avatar-option" />
          <img src="Assets/Users/gery.png" class="avatar-option" />
        </div>
        <input type="date" id="newProfileBirthDate" class="w-auto" />
        <div class="panel-buttons">
          <button id="confirmProfile">אישור</button>
          <button id="cancelProfile">ביטול</button>
          <button id="deleteProfile" class="hidden">מחק פרופיל <span id="confirmText" class="confirm-text hidden">— בטוח?</span></button>
        </div>
      </div>
    </div>

    <script src="/js/profiles.js"></script>
  </body>
</html>
