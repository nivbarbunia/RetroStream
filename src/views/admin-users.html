<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רטרו סטרים - ניהול משתמשים</title>
    <link rel="icon" href="/Assets/favicon.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/admin-shared.css">
    <link rel="stylesheet" href="/css/admin-users.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  </head>

  <body class="p-4">
    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="headline" class="m-0">ניהול משתמשים</h1>
      <nav class="d-flex gap-3 align-items-center">
        <a href="/admin" class="admin-link">חזרה למרכז בקרה</a>
        <button id="logoutBtn" class="btn-logout">התנתק</button>
      </nav>
    </header>

    <div class="admin-content mx-auto">
    <!-- SEARCH -->
    <div class="search-row d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex gap-2 justify-content-start">
        <input type="text" id="searchInput" class="searchInput" placeholder="חפש לפי שם או אימייל..." autocomplete="off" />
        <button id="submitBtn" class="searchRowBtn d-flex align-items-center gap-2">חפש<i class="fa-solid fa-magnifying-glass"></i></button>
        <p id="message" class="message mb-0 me-3"></p>
      </div>
    
      <button id="resetBtn" class="searchRowBtn hidden d-flex align-items-center align-self-stretch gap-2">אפס חיפוש<i class="fa-solid fa-filter-circle-xmark"></i></button>
    </div>

    <!-- TABLE -->
    <div class="wrapper">
      <table class="users-table">
        <thead>
          <tr>
            <th>שם</th>
            <th>אימייל</th>
            <th>תפקיד</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
    </div>
    <!-- EDIT MODAL (Bootstrap) -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content edit-modal">
          <div class="modal-header d-flex justify-content-between">
            <h2 class="modal-title fs-4">עריכת משתמש</h2>
            <button type="button" class="btn-close btn-close-white m-0" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <span class="d-flex gap-4">
              <div class="d-flex flex-column w-75">
                <label for="editName">שם</label>
                <input type="text" id="editName" />
              </div>
              <div class="d-flex flex-column w-25">
                <label for="editRole">תפקיד</label>
                <select id="editRole">
                  <option value="user">user</option>
                  <option value="admin">admin</option>
                </select>
              </div>
            </span>
            <div>
              <label>אימייל</label>
              <input type="email" id="editEmail" />
            </div>
    
            <p id="modalMessage" class="m-0"></p>
          </div>
          <div class="modal-footer">
            <button id="saveEdit" class="btn-save">שמור</button>
            <button class="btn-cancel" data-bs-dismiss="modal">ביטול</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-users.js"></script>
  </body>
</html>
